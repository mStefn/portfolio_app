name: Deploy App (Auto CI/CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mstefn/portfolio_app_v2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy-app:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-dns=false

      - name: Check Tailscale connection
        run: |
          echo "Checking Tailscale connection..."
          tailscale status

      - name: Deploy App to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: stefan
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd /home/stefan/domain/portfolio_app || {
              echo "❌ Project directory not found!"
              exit 1
            }

            echo "📥 Pulling latest repository changes..."
            git pull origin main

            echo "🔐 Logging in to GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "📦 Pulling latest Docker images..."
            docker compose pull

            echo "🚀 Starting containers..."

            docker compose up -d --remove-orphans

            echo "🧹 Cleaning unused Docker images..."

            docker image prune -af

            echo "✅ Deployment completed."

  health-check-app:
    needs: deploy-app
    runs-on: ubuntu-latest

    steps:
      - name: Check Health
        run: |
          echo "Waiting for app to start (up to 60 seconds)..."

          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://portfolio.m-stefn.com.pl/ || echo "000")

            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Portfolio is Healthy!"
              exit 0
            fi

            echo "Attempt $i/12: App returned $STATUS. Waiting 5 seconds..."

            sleep 5
          done

          echo "❌ Portfolio did not start in time!"
          exit 1

  notify:
    needs:
      - build-and-push
      - deploy-app
      - health-check-app

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ (needs.build-and-push.result == 'success' && needs.deploy-app.result == 'success' && needs.health-check-app.result == 'success') && 'success' || 'failure' }}
          title: "🚀 Portfolio Auto-Deployment Report"
          description: |
            **1. Build & Push:** ${{ needs.build-and-push.result }}
            **2. Server Deploy:** ${{ needs.deploy-app.result }}
            **3. App Health Check:** ${{ needs.health-check-app.result }}

            The latest changes to the main branch have been deployed.

            Check details here:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
